[package]
name = "logbook-gpui-proto"
version = "0.0.0"
edition = "2021"
description = "Experiment: a GPUI front end over logbook-core (see docs/PLAN.md)"
publish = false

# Its own workspace and lockfile: GPUI's dependency tree stays out of the shipping app's Cargo.lock.
[workspace]

[dependencies]
logbook-core = { path = "../core" }
gpui-kit = "0.9.1"
anyhow = "1"
chrono = "0.4"
dirs = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The update check only: it reads latest.json. Installing an update stays with the Tauri app.
ureq = "3"
