[package]
name = "logbook"
version = "0.6.8"
edition = "2021"
description = "Logbook: search, browse and resume GitHub Copilot CLI and Claude Code sessions"

[lib]
name = "logbook_app"
path = "src/lib.rs"

[[bin]]
name = "logbook"
path = "src/main.rs"

[dependencies]
logbook-core = { path = "../core" }
gpui-kit = "0.9.1"
anyhow = "1"
chrono = "0.4"
dirs = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The update check and download, and checking the installer's minisign signature (what Tauri's updater did).
ureq = "3"
minisign-verify = "0.2"
base64 = "0.23"

[dev-dependencies]
# GPUI's own headless test support (src/tests.rs): real clicks and keys against the real views. Named `gpui`
# because its test macro expands to `gpui::...`.
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }

[target.'cfg(windows)'.dependencies]
# The single-instance guard.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
# The exe's icon and version info (Windows only; a no-op elsewhere).
winresource = "0.1"
