[package]
name = "logbook"
version = "0.1.1"
edition = "2021"
description = "Logbook: search, browse and resume GitHub Copilot CLI sessions"

[lib]
name = "logbook_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
# generate_context! embeds the plugins config as serde_json values.
serde_json = "1"
logbook-core = { path = "../core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
# Without the default `zip` feature: it only unpacks v1-style update artifacts, and it brought in
# RUSTSEC-2026-0367/0368/0369 for notes. The NSIS installer is a v2 artifact.
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
