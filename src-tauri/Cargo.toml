[package]
name = "logbook"
version = "0.1.0"
edition = "2021"
description = "Logbook: search, browse and resume GitHub Copilot CLI sessions"

[lib]
name = "logbook_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
logbook-core = { path = "../core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
