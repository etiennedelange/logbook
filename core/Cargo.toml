[package]
name = "logbook-core"
version = "0.6.4"
edition = "2021"
description = "Indexing and search over coding-agent sessions (GitHub Copilot CLI, Claude Code) for Logbook"


[dependencies]
anyhow = "1"
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
chrono = { version = "0.4", features = ["clock", "serde"] }
dirs = "7"
serde = { version = "1", features = ["derive"] }
memchr = "2"
serde_json = "1"
rayon = "1.12.0"
