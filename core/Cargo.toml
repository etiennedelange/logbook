[package]
name = "logbook-core"
version = "0.1.0"
edition = "2021"
description = "Indexing and search over GitHub Copilot CLI sessions for Logbook"


[dependencies]
anyhow = "1"
bincode = "1"
chrono = { version = "0.4", features = ["clock", "serde"] }
dirs = "7"
serde = { version = "1", features = ["derive"] }
memchr = "2"
serde_json = "1"
rayon = "1.12.0"
