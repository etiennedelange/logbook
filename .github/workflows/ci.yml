name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The release scripts in tools/release (ship.mjs, changelog.mjs, version.mjs).
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.16.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter .
      - run: pnpm test:tools

  rust:
    # Windows is the target platform; Linux matches the dev container and runs the headless UI tests too.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # No debug info: faster compiling and linking, and a smaller cache.
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # What GPUI links against on Linux; same list as .devcontainer/post-create.sh.
      - name: Install system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libfreetype-dev pkg-config

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt
      # Formatting doesn't depend on the platform, so one runner checks it, before the slow build.
      - run: cargo fmt --all -- --check
        if: runner.os == 'Linux'
      # PRs restore main's cache but don't save their own.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Keep going after a failing test binary, so one run shows every platform failure.
      - run: cargo test --workspace --locked --no-fail-fast

  # The installer, built the way release.yml builds it but unsigned, so every change shows that the release
  # path still works, and the exe can be tried (and updated over an installed Logbook) without cutting a
  # release: Actions -> this run -> Artifacts.
  installer:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.16.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Only the Tauri CLI (the installer maker); the site and screenshot tool aren't part of the installer.
      - run: pnpm install --frozen-lockfile --filter .
      - run: cargo build --release --locked -p logbook
      # No updater signing key here, so no updater artifacts.
      - name: Build the installer
        working-directory: app
        shell: bash
        run: ../node_modules/.bin/tauri bundle --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logbook-installer
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
