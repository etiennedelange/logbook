name: Release

# A version tag like v0.2.0 on main (pushed by `pnpm release` or the Cut release workflow; see
# docs/RELEASING.md) builds the Windows installer and publishes a GitHub Release with it. The notes
# are the CHANGELOG's section for the version, then GitHub's list of merged PRs (.github/release.yml).
# A tag containing `-` (v0.3.0-rc.1) becomes a pre-release.
on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          package-manager-cache: false
      # Only merged, CI-checked commits get released. "behind" or "identical" means the tag is on main.
      - name: Tag is on main
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$(git rev-parse HEAD)" --jq .status)
          if [ "$status" != behind ] && [ "$status" != identical ]; then
            echo "::error::$TAG is not on main (compared with main: $status). Tag a commit on main."
            exit 1
          fi
      # The tag, package.json, tauri.conf.json, both Cargo.tomls and Cargo.lock must all agree,
      # or the installer would be named for one version and the tag say another.
      - name: Tag matches every version field
        env:
          TAG: ${{ github.ref_name }}
        run: node tools/release/version.mjs --check "$TAG"
      - name: Release notes from the CHANGELOG
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "notes<<CHANGELOG_EOF"
            node tools/release/changelog.mjs notes "$TAG"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

  windows:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write # create the release and upload the installer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installed copies check updates against the public key in tauri.conf.json, and the build signs the
      # updater's installer with the private one (docs/RELEASING.md). Without either, no copy could update.
      - name: Updater key is set
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if grep -q REPLACE_WITH_THE_PUBLIC_KEY src-tauri/tauri.conf.json; then
            echo "::error::plugins.updater.pubkey in src-tauri/tauri.conf.json is still a placeholder. See docs/RELEASING.md."
            exit 1
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is not set. See docs/RELEASING.md."
            exit 1
          fi
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.16.1
      # No caches here: the installer ships, so it's built from a clean slate rather than from a cache
      # something else could have written (zizmor: cache-poisoning). Slower, and releases are rare.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      # Only the app's workspace packages; the site and screenshot tool aren't part of the installer.
      - run: pnpm install --frozen-lockfile --filter logbook-ui --filter .
      # beforeBuildCommand (tauri.conf.json) runs the UI's check + build. The key signs the updater's
      # copy of the installer (-setup.exe.sig). Built, collected and published the way notes and gitr
      # do it, not with tauri-action: its latest.json sends installed copies to an api.github.com
      # asset URL, which GitHub rate-limits per IP and then answers with 403.
      - name: Build the installer
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          rm -rf target/release/bundle
          pnpm tauri build --bundles nsis
      - name: Collect the installer, its signature and latest.json
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          shopt -s nullglob
          files=(target/release/bundle/nsis/*-setup.exe)
          if [ ${#files[@]} -ne 1 ]; then
            echo "::error::Expected one installer, found ${#files[@]}: ${files[*]}"
            exit 1
          fi
          if [[ "${files[0]}" != *"_${version}_"* ]]; then
            echo "::error::${files[0]} is not version $version"
            exit 1
          fi
          if [ ! -f "${files[0]}.sig" ]; then
            echo "::error::No updater signature ${files[0]}.sig"
            exit 1
          fi
          mkdir -p dist-release
          cp "${files[0]}" "${files[0]}.sig" dist-release/
          # The in-app updater reads releases/latest/download/latest.json. Its `notes` are the
          # CHANGELOG section alone: the in-app What's New. GitHub's "latest" skips pre-releases,
          # so a pre-release never reaches installed copies.
          node tools/release/updater.mjs manifest "$version" "${files[0]}" "${files[0]}.sig" > dist-release/latest.json
          cat dist-release/latest.json
          cd dist-release
          sha256sum -- *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logbook-${{ github.ref_name }}-windows
          path: dist-release/
          if-no-files-found: error
      # The CHANGELOG section first, then GitHub's list of merged PRs (.github/release.yml). A rerun
      # replaces the files of the release it made.
      - name: Publish the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NOTES: ${{ needs.verify.outputs.notes }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist-release/* --clobber
            exit 0
          fi
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
          prerelease=()
          [[ "$TAG" == *-* ]] && prerelease=(--prerelease)
          gh release create "$TAG" dist-release/* \
            --verify-tag \
            --title "Logbook $TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes \
            "${prerelease[@]}"

  # A release made with the job's own token doesn't trigger other workflows, so site-rebuild.yml's
  # `release: published` never fires for it; start it directly, now the installer is attached.
  # Pre-releases don't change the site.
  site:
    needs: windows
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Rebuild the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site-rebuild.yml --repo "$GITHUB_REPOSITORY" --ref main
