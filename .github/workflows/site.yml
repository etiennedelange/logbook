name: Site

# Builds the marketing site (site/) and deploys it to Cloudflare Pages.
# Runs when a release is published (so the download link goes live with it), when the site or its
# screenshots change on main, or by hand.
on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - site/**
      - docs/screenshots/**
      - .github/workflows/site.yml
  pull_request:
    paths:
      - site/**
      - docs/screenshots/**
      - .github/workflows/site.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.16.1
      # No package cache: this build is what gets deployed (zizmor: cache-poisoning).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --filter logbook-site
      # Without SITE_URL, canonical and og:image fall back to localhost (astro.config.mjs). PRs only
      # build, so only a deploy needs it.
      - name: Require SITE_URL to deploy
        if: github.event_name != 'pull_request'
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::error::Set the SITE_URL repository variable (Settings > Variables) before deploying."
            exit 1
          fi
      - run: pnpm --filter logbook-site build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site/dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    # Pull requests only build. Deploying needs the Cloudflare secrets, which forks and PRs don't get.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: cloudflare-pages
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=logbook --branch=main
