name: GPUI prototype

# Builds the gpui-proto experiment on Windows and attaches the exe to the run, so it can be tried
# without cutting a release: Actions → this run → Artifacts. Not part of CI or releases.
on:
  push:
    paths:
      - gpui-proto/**
      - core/**
      - .github/workflows/gpui-proto.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpui-proto-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      # gpui-proto is its own workspace, so it has its own target folder and lockfile.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: gpui-proto
      - name: Test
        working-directory: gpui-proto
        run: cargo test --locked
      # Release, so memory and speed are comparable with the shipped app.
      - name: Build
        working-directory: gpui-proto
        run: cargo build --release --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logbook-gpui-proto-windows
          path: gpui-proto/target/release/logbook-gpui-proto.exe
          if-no-files-found: error
          retention-days: 14
