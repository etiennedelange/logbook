# cargo audit waivers. Each one needs a reason, and goes when the reason does.
#
# These come in through GPUI's Linux backend (the portal client, ashpd, which uses zbus) and are not in
# the Windows build, which is the only one Logbook ships. Check with:
#   cargo tree -i <crate> --target x86_64-pc-windows-msvc
# They clear when zbus moves to maintained crates; re-check on each GPUI upgrade, and drop a waiver as
# soon as its crate leaves Cargo.lock.

[advisories]
ignore = [
  "RUSTSEC-2026-0370", # zvariant: unmaintained (Linux-only, zbus via GPUI's portal client)
  "RUSTSEC-2026-0371", # zbus_names: unmaintained (Linux-only, zbus via GPUI's portal client)
  "RUSTSEC-2026-0372", # zvariant_derive: unmaintained (Linux-only, zbus via GPUI's portal client)
]
